<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Civ 5 Era Playlist</title>
  <link rel="stylesheet" href="css/styles.css" />
  <!-- 
    PROJECT GOAL:
    Custom music player for Civilization 5 sessions.
    - Sidebar to switch between historical eras
    - Each era has its own looping playlist of personal tracks that match the vibe
    - Full player controls (play/pause, next/prev, progress, volume, shuffle)
    - Track list visible for current era
    - Clean modern dark UI
    - Pure static site → free GitHub Pages hosting

    SONG MANAGEMENT (no manual code editing):
    1. Drop mp3s into audio/<era>/ folders  (ancient, classical, medieval, etc.)
    2. Run: node generate-tracks.js
    3. Refresh. Titles come from filenames. ID3 tags (artist/cover) are read when playing.
  -->
</head>
<body>
  <div class="app">
    <!-- LEFT SIDEBAR: Era switcher -->
    <aside class="sidebar">
      <div class="logo">
        <span class="logo-icon">⚔</span>
        <div>
          <h1>Civ 5</h1>
          <p>Era Playlists</p>
        </div>
      </div>

      <nav class="era-nav" id="era-nav">
        <!-- Eras injected by JS -->
      </nav>

      <div class="sidebar-footer">
        <p>Personal vibe playlists</p>
        <p class="hint">audio/&lt;era&gt;/ → run generate-tracks.js</p>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">
      <header class="era-header">
        <div>
          <h2 id="current-era-name">Ancient</h2>
          <p id="current-era-desc">Select an era to begin</p>
        </div>
        <div class="era-meta">
          <span id="track-count">0 tracks</span>
        </div>
      </header>

      <section class="track-list-section">
        <div class="track-list" id="track-list">
          <!-- Tracks injected by JS -->
        </div>
      </section>

      <!-- BOTTOM PLAYER BAR -->
      <footer class="player-bar">
        <div class="now-playing">
          <div class="now-playing-art" id="now-art">♪</div>
          <div class="now-playing-info">
            <div class="now-title" id="now-title">No track selected</div>
            <div class="now-artist" id="now-artist">—</div>
          </div>
        </div>

        <div class="player-controls">
          <div class="control-buttons">
            <button class="ctrl-btn" id="btn-shuffle" title="Shuffle: OFF">🔀</button>
            <button class="ctrl-btn" id="btn-prev" title="Previous">⏮</button>
            <button class="ctrl-btn play-btn" id="btn-play" title="Play / Pause">▶</button>
            <button class="ctrl-btn" id="btn-next" title="Next">⏭</button>
          </div>

          <div class="progress-row">
            <span class="time" id="current-time">0:00</span>
            <div class="progress-bar" id="progress-bar">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
            <span class="time" id="duration">0:00</span>
          </div>
        </div>

        <div class="volume-section">
          <button class="ctrl-btn" id="btn-mute" title="Mute">🔊</button>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" />
        </div>
      </footer>
    </main>
  </div>

  <audio id="audio" preload="metadata"></audio>

  <!-- Optional: ID3 tag reader for real title/artist/cover art -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.7/jsmediatags.min.js"></script>

  <!-- Auto-generated track list (run generate-tracks.js to create/update) -->
  <script src="js/tracks-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
